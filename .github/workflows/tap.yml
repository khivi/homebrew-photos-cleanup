# Tap CI on macos-latest (the cask is macOS-only):
#   syntax  - `brew test-bot --only-tap-syntax` (style + audit). Static, no
#             download, safe on every push/PR.
#   install - a real `brew install --cask` from this checkout: brew downloads
#             the release zip and verifies its sha256, so a bad checksum fails.
#
# The release workflow commits each new cask straight to main (no PR), so the
# push trigger is what install-tests each release.
name: tap
on: [push, pull_request]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      - run: brew test-bot --only-tap-syntax

  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      # `brew tap` by name would test the default branch, not this checkout.
      # Pointing the tap directory at the checkout installs the proposed cask.
      - run: |
          tap_dir="$(brew --repository)/Library/Taps/khivi/homebrew-photos-cleanup"
          rm -rf "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew install --cask khivi/photos-cleanup/photos-cleanup
          test -d "/Applications/Photos Cleanup.app"
          spctl -a -vv "/Applications/Photos Cleanup.app"
